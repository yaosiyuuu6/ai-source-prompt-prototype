  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;span&gt;Prompt 原文&lt;/span&gt;
          &lt;textarea id=&quot;prompt-editor&quot; class=&quot;ant-input prompt-editor&quot; spellcheck=&quot;false&quot;&gt;&lt;/textarea&gt;
          &lt;span class=&quot;editor-meta&quot;&gt;
            &lt;span id=&quot;draft-source&quot;&gt;来源：平台默认&lt;/span&gt;
            &lt;span id=&quot;char-count&quot;&gt;0 字符&lt;/span&gt;
          &lt;/span&gt;
        &lt;/label&gt;
        &lt;div id=&quot;editor-error&quot; class=&quot;editor-error&quot; role=&quot;alert&quot; aria-live=&quot;assertive&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/aside&gt;

    &lt;div id=&quot;toast&quot; class=&quot;toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ai-source-antd-prompt-flow&#x27;);
      const composer = root.querySelector(&#x27;#prompt-composer&#x27;);
      const scopePanel = root.querySelector(&#x27;#scope-panel&#x27;);
      const openScopeButton = root.querySelector(&#x27;#open-scope&#x27;);
      const closeScopeButton = root.querySelector(&#x27;#close-scope&#x27;);
      const businessSelect = root.querySelector(&#x27;#business-select&#x27;);
      const requestInput = root.querySelector(&#x27;#request-input&#x27;);
      const startTaskButton = root.querySelector(&#x27;#start-task&#x27;);
      const resultState = root.querySelector(&#x27;#result-state&#x27;);
      const drawer = root.querySelector(&#x27;#prompt-drawer&#x27;);
      const drawerMode = root.querySelector(&#x27;#drawer-mode&#x27;);
      const drawerBusiness = root.querySelector(&#x27;#drawer-business&#x27;);
      const drawerDescription = root.querySelector(&#x27;#drawer-description&#x27;);
      const closeDrawerButton = root.querySelector(&#x27;#close-drawer&#x27;);
      const importButton = root.querySelector(&#x27;#import-prompt&#x27;);
      const fileInput = root.querySelector(&#x27;#prompt-file&#x27;);
      const downloadButton = root.querySelector(&#x27;#download-prompt&#x27;);
      const editor = root.querySelector(&#x27;#prompt-editor&#x27;);
      const draftSource = root.querySelector(&#x27;#draft-source&#x27;);
      const charCount = root.querySelector(&#x27;#char-count&#x27;);
      const editorError = root.querySelector(&#x27;#editor-error&#x27;);
      const saveButton = root.querySelector(&#x27;#save-prompt&#x27;);
      const toast = root.querySelector(&#x27;#toast&#x27;);

      const labels = { law: &#x27;法规&#x27;, integrity: &#x27;诚信库&#x27;, bidding: &#x27;招投标&#x27;, custom: &#x27;自定义&#x27; };
      const defaults = {
        law: `# 法规找源\n\n&lt;task_description&gt;\n根据法规标题、颁布日期、实施日期和颁布者，检索并确认唯一对应的政府官方网站法规正文页。\n&lt;/task_description&gt;\n\n&lt;input_data&gt;\n- 法规标题：{{title}}\n- 颁布日期：{{promulgationDate}}\n- 实施日期：{{implementationDate}}\n- 颁布者：{{promulgator}}\n&lt;/input_data&gt;\n\n&lt;task_rules&gt;\n- 最终来源必须是政府官方网站。\n- 无法确认的信息不得编造。\n&lt;/task_rules&gt;\n\n&lt;task_workflow&gt;\n1. 按规定查询词查找候选。\n2. 进入正文并核验必要附件。\n3. 提取来源网站、链接与路径。\n&lt;/task_workflow&gt;`,
        integrity: `# 诚信库找源\n\n&lt;task_description&gt;\n根据处罚主体、处罚文号、处理机构和披露日期，检索并确认政府官方网站行政处罚正文页。\n&lt;/task_description&gt;\n\n&lt;input_data&gt;\n- 被处罚企业或个人：{{entityName}}\n- 行政处罚决定书文号：{{documentNumber}}\n- 处理机构：{{processingAuthority}}\n- 披露日期：{{disclosureDate}}\n&lt;/input_data&gt;\n\n&lt;task_rules&gt;\n- 核验处罚文号、处理机构和被处罚主体。\n- 无法确认的信息不得编造。\n&lt;/task_rules&gt;\n\n&lt;task_workflow&gt;\n1. 规范化检索用文号。\n2. 查询政府官方网站候选。\n3. 核验正文与必要附件。\n&lt;/task_workflow&gt;`,
        bidding: `# 招投标找源\n\n&lt;task_description&gt;\n根据项目名称、发布日期、招采单位、中标单位和金额，检索并确认唯一对应的招投标公告正文页。\n&lt;/task_description&gt;\n\n&lt;input_data&gt;\n- 项目名称：{{projectName}}\n- 发布日期：{{publishDate}}\n- 招采单位：{{biddingCompany}}\n- 中标单位：{{winningCompany}}\n&lt;/input_data&gt;\n\n&lt;task_rules&gt;\n- 最终来源必须是招采单位官方网站或规定的政府采购来源。\n- 无法确认的信息不得编造。\n&lt;/task_rules&gt;\n\n&lt;task_workflow&gt;\n1. 判断招采单位类型。\n2. 按规定路径查询公告。\n3. 核验正文、附件与上级列表。\n&lt;/task_workflow&gt;`,
        custom: &#x27;&#x27;
      };
      const applied = { ...defaults };
      let customSaved = false;
      let activeBusiness = &#x27;&#x27;;
      let draft = &#x27;&#x27;;
      let draftOrigin = &#x27;平台默认&#x27;;
      let toastTimer;

      const isDirty = () =&gt; Boolean(activeBusiness) &amp;&amp; draft !== applied[activeBusiness];

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.hidden = false;
        toastTimer = window.setTimeout(() =&gt; { toast.hidden = true; }, 3200);
      }

      function setScopeOpen(open) {
        scopePanel.classList.toggle(&#x27;is-open&#x27;, open);
        composer.classList.toggle(&#x27;is-expanded&#x27;, open);
        openScopeButton.setAttribute(&#x27;aria-expanded&#x27;, String(open));
        requestInput.hidden = open;
        if (open) businessSelect.focus();
      }

      function updateEditorMeta() {
        charCount.textContent = `${draft.length} 字符`;
        draftSource.textContent = `来源：${draftOrigin}`;
      }

      function openDrawer() {
        if (!activeBusiness) return;
        const editable = activeBusiness === &#x27;custom&#x27;;
        draft = applied[activeBusiness];
        draftOrigin = editable ? (customSaved ? &#x27;已保存自定义版本&#x27; : &#x27;未保存&#x27;) : &#x27;平台预置&#x27;;
        editor.value = draft;
        editor.readOnly = !editable;
        editor.placeholder = editable ? &#x27;请输入自定义 Prompt 原文&#x27; : &#x27;&#x27;;
        drawerMode.textContent = editable ? &#x27;编辑&#x27; : &#x27;查看&#x27;;
        drawerBusiness.textContent = labels[activeBusiness];
        drawerDescription.textContent = editable
          ? &#x27;保存后将在当前页面会话中持续使用&#x27;
          : &#x27;平台预置 Prompt，仅支持查看和下载&#x27;;
        importButton.hidden = !editable;
        saveButton.hidden = !editable;
        editorError.textContent = &#x27;&#x27;;
        updateEditorMeta();
        drawer.classList.add(&#x27;is-open&#x27;);
        drawer.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
        editor.focus();
      }

      function closeDrawer(force = false) {
        if (!force &amp;&amp; isDirty() &amp;&amp; !window.confirm(&#x27;当前修改尚未应用，确定放弃吗？&#x27;)) return;
        drawer.classList.remove(&#x27;is-open&#x27;);
        drawer.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        editorError.textContent = &#x27;&#x27;;
        openScopeButton.focus();
      }

      openScopeButton.addEventListener(&#x27;click&#x27;, () =&gt; setScopeOpen(!scopePanel.classList.contains(&#x27;is-open&#x27;)));
      closeScopeButton.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.preventDefault();
        event.stopPropagation();
        setScopeOpen(false);
        openScopeButton.focus();
      });
      businessSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
        const nextBusiness = businessSelect.value;
        if (drawer.classList.contains(&#x27;is-open&#x27;) &amp;&amp; isDirty() &amp;&amp; !window.confirm(&#x27;当前修改尚未保存，确定放弃吗？&#x27;)) {
          businessSelect.value = activeBusiness;
          return;
        }
        activeBusiness = nextBusiness;
        if (activeBusiness) openDrawer();
        else closeDrawer(true);
      });
      businessSelect.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (businessSelect.value &amp;&amp; businessSelect.value === activeBusiness &amp;&amp; !drawer.classList.contains(&#x27;is-open&#x27;)) openDrawer();
      });
      closeDrawerButton.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        event.preventDefault();
        event.stopPropagation();
        closeDrawer(false);
      });
      root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Escape&#x27; &amp;&amp; drawer.classList.contains(&#x27;is-open&#x27;)) {
          event.preventDefault();
          closeDrawer(false);
        }
      });

      editor.addEventListener(&#x27;input&#x27;, () =&gt; {
        draft = editor.value;
        draftOrigin = &#x27;手动编辑&#x27;;
        editorError.textContent = &#x27;&#x27;;
        updateEditorMeta();
      });

      importButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (activeBusiness === &#x27;custom&#x27;) fileInput.click();
      });
      fileInput.addEventListener(&#x27;change&#x27;, () =&gt; {
        const file = fileInput.files &amp;&amp; fileInput.files[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith(&#x27;.md&#x27;)) {
          editorError.textContent = &#x27;仅支持导入 .md 文件，请重新选择。&#x27;;
          fileInput.value = &#x27;&#x27;;
          return;
        }
        if (file.size &gt; 1024 * 1024) {
          editorError.textContent = &#x27;文件超过 1 MB，请精简后重新导入。&#x27;;
          fileInput.value = &#x27;&#x27;;
          return;
        }
        const reader = new FileReader();
        reader.onload = () =&gt; {
          draft = String(reader.result || &#x27;&#x27;);
          draftOrigin = file.name;
          editor.value = draft;
          editorError.textContent = &#x27;&#x27;;
          updateEditorMeta();
          fileInput.value = &#x27;&#x27;;
        };
        reader.onerror = () =&gt; {
          editorError.textContent = &#x27;文件读取失败，请重新选择。&#x27;;
          fileInput.value = &#x27;&#x27;;
        };
        reader.readAsText(file);
      });

      downloadButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        const blob = new Blob([editor.value], { type: &#x27;text/markdown;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        const stamp = new Date().toISOString().replace(/[-:T]/g, &#x27;&#x27;).slice(0, 12);
        link.href = url;
        link.download = `${labels[activeBusiness]}-prompt-${stamp}.md`;
        link.click();
        window.setTimeout(() =&gt; URL.revokeObjectURL(url), 0);
        showToast(&#x27;Prompt 已下载到本地&#x27;);
      });

      saveButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (activeBusiness !== &#x27;custom&#x27;) return;
        const content = editor.value;
        if (!content.trim()) {
          editorError.textContent = &#x27;Prompt 内容不能为空，请填写后再应用。&#x27;;
          editor.focus();
          return;
        }
        applied[activeBusiness] = content;
        customSaved = true;
        draft = content;
        closeDrawer(true);
        showToast(&#x27;自定义 Prompt 保存成功，将用于本次找源&#x27;);
      });

      startTaskButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (!activeBusiness) {
          setScopeOpen(true);
          showToast(&#x27;请先选择找源范围&#x27;);
          return;
        }
        if (drawer.classList.contains(&#x27;is-open&#x27;) &amp;&amp; isDirty() &amp;&amp; !window.confirm(&#x27;Prompt 有未应用修改。本次任务将使用上一次已应用版本，是否继续？&#x27;)) return;
        closeDrawer(true);
        setScopeOpen(false);
        businessSelect.disabled = true;
        openScopeButton.disabled = true;
        startTaskButton.disabled = true;
        requestInput.disabled = true;
        resultState.innerHTML = &#x27;&lt;span class=&quot;ant-spin ant-spin-spinning&quot;&gt;&lt;span class=&quot;ant-spin-dot ant-spin-dot-spin&quot;&gt;&lt;i class=&quot;ant-spin-dot-item&quot;&gt;&lt;/i&gt;&lt;i class=&quot;ant-spin-dot-item&quot;&gt;&lt;/i&gt;&lt;i class=&quot;ant-spin-dot-item&quot;&gt;&lt;/i&gt;&lt;i class=&quot;ant-spin-dot-item&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/span&gt;&lt;div&gt;正在找源…&lt;/div&gt;&#x27;;
        showToast(`已使用${activeBusiness === &#x27;custom&#x27; ? &#x27;自定义&#x27; : &#x27;平台预置&#x27;} Prompt 开始任务`);
      });

      updateEditorMeta();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
