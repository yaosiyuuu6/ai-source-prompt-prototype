<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AI找源 - 多文件找源原型</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --primary-soft: #e6f4ff;
      --success: #18a058;
      --text: #1f2329;
      --text-secondary: #646a73;
      --text-tertiary: #8f959e;
      --border: #e5e6eb;
      --border-strong: #d7d9df;
      --fill: #f5f6f7;
      --panel: #ffffff;
      --shadow: 0 8px 28px rgba(31, 35, 41, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #fff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    button, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid rgba(22, 119, 255, 0.22); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .app { display: grid; grid-template-columns: 25% 75%; width: 100%; height: 100%; min-width: 1024px; background: #fff; }
    .left-panel { position: relative; z-index: 2; min-width: 0; padding: 20px 24px; border-right: 1px solid var(--border); background: #fff; }
    .brand { margin: 0; font-size: 16px; font-weight: 600; }

    .composer { position: relative; width: 100%; min-height: 130px; margin-top: 16px; padding: 14px 12px 10px; overflow: hidden; border: 1px solid var(--border-strong); border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(31, 35, 41, 0.06); transition: min-height 220ms ease-out; }
    .composer.is-expanded { min-height: 292px; }
    .scope-panel { display: none; }
    .scope-panel.is-open { display: block; }
    .scope-title { display: flex; align-items: center; justify-content: space-between; margin: -4px -2px 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .scope-label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; }
    .select-wrap { position: relative; min-width: 0; }
    .select-wrap::after { position: absolute; top: 50%; right: 12px; width: 7px; height: 7px; content: ""; pointer-events: none; border-right: 1.5px solid #697078; border-bottom: 1.5px solid #697078; transform: translateY(-70%) rotate(45deg); }
    .scope-select { width: 100%; height: 36px; padding: 0 34px 0 11px; border: 1px solid var(--border-strong); border-radius: 7px; appearance: none; color: var(--text); background: #fff; cursor: pointer; }
    .scope-select:hover { border-color: var(--primary-hover); }
    .button, .send-button, .tab { display: inline-flex; align-items: center; justify-content: center; border: 0; cursor: pointer; white-space: nowrap; }
    .icon-button { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px; color: var(--text); background: transparent; cursor: pointer; }
    .icon-button:hover { color: var(--primary); background: var(--fill); }
    .icon-button svg { width: 21px; height: 21px; }
    .scope-close svg { width: 17px; height: 17px; }
    .tool-divider { width: 1px; height: 22px; margin: 0 8px; background: var(--border-strong); }

    .upload-panel { display: none; margin: -14px -12px 0; border-bottom: 1px solid var(--border); background: #fafafa; }
    .upload-panel.is-open { display: block; }
    .upload-title { display: flex; height: 48px; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; }
    .upload-dropzone { display: flex; width: 100%; height: 112px; flex-direction: column; align-items: center; justify-content: center; padding: 0; border: 0; color: var(--text); background: transparent; cursor: pointer; }
    .upload-dropzone:hover { background: #f5f7fa; }
    .upload-dropzone svg { width: 32px; height: 32px; margin-bottom: 3px; }
    .upload-dropzone strong { font-size: 15px; font-weight: 600; }
    .upload-dropzone span { margin-top: 2px; color: var(--text-tertiary); font-size: 13px; }

    .attachment-area { margin-bottom: 10px; }
    .attachment-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .attachment-title { font-size: 14px; font-weight: 600; }
    .attachment-count { color: var(--text-tertiary); font-size: 12px; }
    .file-list { display: flex; max-height: 138px; flex-wrap: wrap; gap: 10px; overflow-y: auto; padding: 0 0 4px; scrollbar-width: thin; }
    .file-card, .add-card { position: relative; flex: 0 0 100%; height: 58px; border-radius: 8px; }
    .file-card { display: flex; align-items: center; gap: 10px; padding: 10px 34px 10px 10px; background: var(--fill); }
    .excel-icon { position: relative; display: grid; flex: 0 0 auto; place-items: center; width: 34px; height: 42px; color: #fff; background: #22b573; font-size: 17px; font-weight: 650; }
    .excel-icon::after { position: absolute; top: 0; right: 0; width: 0; height: 0; content: ""; border-bottom: 8px solid #c9f0de; border-left: 8px solid transparent; }
    .file-name { min-width: 0; overflow: hidden; font-size: 13px; line-height: 20px; text-overflow: ellipsis; white-space: nowrap; }
    .remove-file { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; color: var(--text-tertiary); background: transparent; cursor: pointer; }
    .remove-file:hover { color: var(--text); background: #e7e9ec; }
    .add-card { display: grid; flex-basis: 58px; max-width: 58px; place-items: center; border: 1px dashed #c8cbd1; color: #878d96; background: #fff; cursor: pointer; }
    .add-card:hover { color: var(--primary); border-color: var(--primary); background: #f7fbff; }
    .add-card svg { width: 24px; height: 24px; }

    .message-input { display: block; width: 100%; min-height: 62px; padding: 0; resize: none; border: 0; color: var(--text); background: #fff; line-height: 1.55; }
    .message-input:focus { outline: none; }
    .message-input::placeholder { color: #b7bbc1; }
    .composer.is-uploading { min-height: 292px; }
    .composer.is-uploading .message-input { min-height: 72px; padding: 16px 0 8px; }
    .composer-footer { display: flex; align-items: center; min-height: 34px; margin-top: 4px; }
    .send-button { width: 34px; height: 34px; margin-left: auto; border-radius: 50%; color: #fff; background: var(--primary); box-shadow: 0 4px 12px rgba(22, 119, 255, 0.25); }
    .send-button:hover { background: var(--primary-hover); }
    .send-button svg { width: 18px; height: 18px; }

    .workspace { display: flex; min-width: 0; flex-direction: column; background: #f6f7f9; }
    .workspace-head { display: flex; min-height: 58px; align-items: flex-end; padding: 10px 20px 0; border-bottom: 1px solid var(--border); background: #fff; }
    .tabs { display: flex; min-width: 0; flex: 1; gap: 4px; overflow-x: auto; padding-top: 4px; scrollbar-width: thin; }
    .tab { position: relative; flex: 0 0 auto; gap: 8px; max-width: 260px; height: 43px; padding: 0 14px; border: 1px solid transparent; border-bottom: 0; border-radius: 9px 9px 0 0; color: var(--text-secondary); background: #f2f3f5; font-size: 13px; }
    .tab:hover { color: var(--text); background: #e9ebee; }
    .tab.is-active { z-index: 2; color: var(--primary); border-color: var(--border); background: #fff; }
    .tab.is-active::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; content: ""; background: #fff; }
    .tab-icon { width: 15px; height: 15px; flex: 0 0 auto; }
    .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-close { display: grid; flex: 0 0 auto; place-items: center; width: 18px; height: 18px; border-radius: 4px; font-size: 16px; line-height: 1; }
    .tab-close:hover { background: #dfe2e6; }
    .workspace-actions { display: flex; gap: 8px; padding: 0 0 8px 14px; }
    .button { gap: 6px; height: 32px; padding: 0 13px; border: 1px solid var(--border-strong); border-radius: 6px; background: #fff; font-size: 13px; }
    .button:hover { color: var(--primary); border-color: var(--primary); }
    .button.primary { color: #fff; border-color: var(--primary); background: var(--primary); }
    .button.primary:hover { color: #fff; border-color: var(--primary-hover); background: var(--primary-hover); }

    .content { position: relative; min-width: 0; flex: 1; overflow: hidden; background: #fff; }
    .panel { display: none; width: 100%; height: 100%; }
    .panel.is-active { display: block; }
    .result-panel { overflow: auto; background: #fff; }
    .result-summary { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 18px; border-bottom: 1px solid var(--border); background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(6px); }
    .result-summary strong { font-size: 14px; font-weight: 600; }
    .result-summary span { color: var(--text-secondary); font-size: 13px; }
    .result-status { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; color: var(--success) !important; }
    .result-status::before { width: 7px; height: 7px; content: ""; border-radius: 50%; background: var(--success); }
    .table-wrap { min-width: 1180px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 14px; }
    th, td { border-right: 1px solid #e8eaed; border-bottom: 1px solid #e8eaed; text-align: left; vertical-align: top; }
    th { position: sticky; top: 48px; z-index: 3; height: 48px; padding: 14px 12px; background: #fafafa; color: #24272c; font-weight: 600; white-space: nowrap; }
    td { height: 96px; padding: 14px 12px; color: #363a40; line-height: 1.65; overflow-wrap: anywhere; }
    tbody tr:hover td { background: #f7fbff; }
    th:first-child, td:first-child { border-left: 1px solid #e8eaed; }
    .seq-cell { position: relative; font-variant-numeric: tabular-nums; }
    .seq-cell::before { position: absolute; top: 0; left: 0; width: 0; height: 0; content: ""; border-top: 9px solid #1d9f4e; border-right: 9px solid transparent; }
    .title-cell { color: #1f2329; font-weight: 500; }
    .link { color: var(--primary); text-decoration: none; }
    .link:hover { text-decoration: underline; }

    .prompt-panel { padding: 24px; overflow: auto; background: #f6f7f9; }
    .prompt-card { display: flex; width: 100%; min-height: 100%; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
    .prompt-header { display: flex; min-height: 70px; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .prompt-title { min-width: 0; }
    .prompt-title strong, .prompt-title span { display: block; }
    .prompt-title strong { font-size: 16px; }
    .prompt-title span { margin-top: 2px; color: var(--text-secondary); font-size: 13px; }
    .prompt-actions { display: flex; gap: 8px; margin-left: auto; }
    .prompt-body { display: flex; min-height: 0; flex: 1; flex-direction: column; padding: 18px; }
    .editor-label { display: flex; margin-bottom: 8px; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; }
    .editor-meta { color: var(--text-tertiary); font-size: 12px; font-weight: 400; }
    .prompt-editor { width: 100%; min-height: 430px; flex: 1; padding: 16px; resize: none; border: 1px solid var(--border-strong); border-radius: 8px; color: #30343a; background: #fbfbfc; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 1.7; }
    .prompt-editor:not([readonly]) { background: #fff; }
    .prompt-editor:focus { border-color: var(--primary); outline: 0; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
    .empty-state { display: grid; height: 100%; place-items: center; color: var(--text-tertiary); background: #fff; }
    .empty-state-inner { text-align: center; }
    .empty-state svg { width: 54px; height: 54px; margin-bottom: 12px; color: #c5c9cf; }
    .empty-state strong { display: block; color: var(--text-secondary); font-size: 15px; font-weight: 500; }
    .empty-state span { display: block; margin-top: 4px; font-size: 13px; }
    .toast { position: fixed; z-index: 20; top: 24px; left: 50%; max-width: 480px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: #fff; box-shadow: 0 8px 24px rgba(31, 35, 41, 0.16); font-size: 13px; transform: translateX(-50%); }
    @media (max-width: 1180px) { .workspace-actions .button:not(.primary) { display: none; } .prompt-panel { padding: 16px; } }
  </style>
</head>
<body>
  <main class="app" aria-label="AI找源多文件交互原型">
    <aside class="left-panel">
      <h1 class="brand">AI找源</h1>
      <section class="composer" aria-label="找源任务输入">
        <div id="scope-panel" class="scope-panel">
          <div class="scope-title"><span>范围限定</span><button id="close-scope" class="icon-button scope-close" type="button" aria-label="关闭范围限定"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
          <label class="scope-label" for="scope-select">范围</label>
          <div class="select-wrap"><select id="scope-select" class="scope-select" aria-label="选择找源范围"><option value="">请选择</option><option value="law">法规</option><option value="integrity">诚信库</option><option value="bidding">招投标</option><option value="custom">自定义 Prompt</option></select></div>
        </div>
        <div id="upload-panel" class="upload-panel">
          <div class="upload-title"><span>附件列表</span><button id="close-upload" class="icon-button scope-close" type="button" aria-label="关闭附件上传"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
          <button id="upload-dropzone" class="upload-dropzone" type="button" aria-label="选择 Excel 文件">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 18.5H5.5a3.5 3.5 0 0 1-.55-6.96A6.5 6.5 0 0 1 17.5 9.4a4.5 4.5 0 0 1 .5 8.97h-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 20V10m0 0-3.5 3.5M12 10l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <strong>附件上传</strong>
            <span>目前仅支持Excel类型</span>
          </button>
        </div>
        <div class="attachment-area">
          <div class="attachment-title-row"><span class="attachment-title">附件列表</span><span id="attachment-count" class="attachment-count">1 个文件</span></div>
          <div id="file-list" class="file-list" aria-live="polite"></div>
        </div>
        <textarea id="message-input" class="message-input" rows="2" placeholder="Press Enter to send message" aria-label="找源请求"></textarea>
        <div class="composer-footer">
          <button id="open-scope" class="icon-button" type="button" aria-label="文档查询" aria-expanded="true" title="文档查询"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3h10l4 4v8M5 3v18h7M15 3v5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16.5" cy="17.5" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="m19 20 2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button id="open-files" class="icon-button" type="button" aria-label="链接" title="打开资源管理器"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9.5 14.5 5-5M7.3 16.7l-1.1 1.1a3.54 3.54 0 0 1-5-5l3.5-3.5a3.54 3.54 0 0 1 5 0M16.7 7.3l1.1-1.1a3.54 3.54 0 0 1 5 5l-3.5 3.5a3.54 3.54 0 0 1-5 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <input id="excel-input" type="file" accept=".xlsx,.xls,.csv" multiple hidden>
          <span class="tool-divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" aria-label="表格" title="表格"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M9 3v18M3 9h18" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button id="send-task" class="send-button" type="button" aria-label="发送并开始找源" title="发送并开始找源"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 19 0-14M6.5 10.5 12 5l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </section>
    </aside>
    <section class="workspace" aria-label="找源工作区">
      <header class="workspace-head"><nav id="tabs" class="tabs" aria-label="文件结果与 Prompt 标签页" role="tablist"></nav><div id="workspace-actions" class="workspace-actions"><button class="button" type="button">导出</button><button class="button" type="button">反馈</button><button class="button primary" type="button">编辑/推送</button></div></header>
      <div id="content" class="content"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    (() => {
      const composer = document.querySelector(".composer");
      const scopePanel = document.getElementById("scope-panel");
      const uploadPanel = document.getElementById("upload-panel");
      const openScopeButton = document.getElementById("open-scope");
      const closeScopeButton = document.getElementById("close-scope");
      const closeUploadButton = document.getElementById("close-upload");
      const uploadDropzone = document.getElementById("upload-dropzone");
      const scopeSelect = document.getElementById("scope-select");
      const openFilesButton = document.getElementById("open-files");
      const excelInput = document.getElementById("excel-input");
      const attachmentArea = document.querySelector(".attachment-area");
      const messageInput = document.getElementById("message-input");
      const fileList = document.getElementById("file-list");
      const attachmentCount = document.getElementById("attachment-count");
      const sendButton = document.getElementById("send-task");
      const tabs = document.getElementById("tabs");
      const content = document.getElementById("content");
      const workspaceActions = document.getElementById("workspace-actions");
      const toast = document.getElementById("toast");
      const labels = { law: "法规", integrity: "诚信库", bidding: "招投标", custom: "自定义" };
      const defaults = {
        law: `# 法规找源\n\n<task_description>\n根据法规标题、颁布日期、实施日期和颁布者，检索并确认唯一对应的政府官方网站法规正文页。\n</task_description>\n\n<input_data>\n- 法规标题：{{title}}\n- 颁布日期：{{promulgationDate}}\n- 实施日期：{{implementationDate}}\n- 颁布者：{{promulgator}}\n</input_data>\n\n<task_rules>\n- 最终来源必须是政府官方网站。\n- 核验法规标题、颁布者、颁布日期和实施日期。\n- 无法确认的信息不得编造。\n</task_rules>\n\n<task_workflow>\n1. 按规定查询词查找候选。\n2. 进入正文并核验必要附件。\n3. 提取来源网站、链接与路径。\n</task_workflow>`,
        integrity: `# 诚信库找源\n\n<task_description>\n根据处罚主体、处罚文号、处理机构和披露日期，检索并确认政府官方网站行政处罚正文页。\n</task_description>\n\n<input_data>\n- 被处罚企业或个人：{{entityName}}\n- 行政处罚决定书文号：{{documentNumber}}\n- 处理机构：{{processingAuthority}}\n- 披露日期：{{disclosureDate}}\n</input_data>\n\n<task_rules>\n- 核验处罚文号、处理机构和被处罚主体。\n- 最终来源必须为政府门户或行政机关官方网站。\n- 无法确认的信息不得编造。\n</task_rules>\n\n<task_workflow>\n1. 规范化检索用文号。\n2. 查询政府官方网站候选。\n3. 核验正文与必要附件。\n</task_workflow>`,
        bidding: `# 招投标找源\n\n<task_description>\n根据项目名称、发布日期、招采单位、中标单位和金额，检索并确认唯一对应的招投标公告正文页。\n</task_description>\n\n<input_data>\n- 项目名称：{{projectName}}\n- 发布日期：{{publishDate}}\n- 招采单位：{{biddingCompany}}\n- 中标单位：{{winningCompany}}\n</input_data>\n\n<task_rules>\n- 最终来源必须是招采单位官方网站或规定的政府采购来源。\n- 无法确认的信息不得编造。\n</task_rules>\n\n<task_workflow>\n1. 判断招采单位类型。\n2. 按规定路径查询公告。\n3. 核验正文、附件与上级列表。\n</task_workflow>`,
        custom: ""
      };
      const dataRows = [
        { seq: "237", title: "江西省交通运输厅关于进一步加强公路工程建设管理的通知", publish: "2022-05-18", effect: "2022-06-01", issuer: "江西省交通运输厅", site: "江西省交通运输厅", source: "https://jt.jiangxi.gov.cn/", path: "首页 > 政务公开 > 政策文件 > 正文", caseUrl: "查看来源", log: "日志" },
        { seq: "802", title: "天津市市场监督管理委员会关于规范市场主体登记工作的实施意见", publish: "2022-08-12", effect: "2022-09-01", issuer: "天津市市场监督管理委员会", site: "天津市市场监督管理委员会", source: "https://scjg.tj.gov.cn/", path: "首页 > 政务公开 > 政策法规 > 正文", caseUrl: "查看来源", log: "日志" },
        { seq: "952", title: "阳泉市人民政府关于印发营商环境创新提升行动方案的通知", publish: "2022-11-03", effect: "2022-11-03", issuer: "阳泉市人民政府", site: "阳泉市人民政府", source: "https://www.yq.gov.cn/", path: "首页 > 政府信息公开 > 市政府文件 > 正文", caseUrl: "查看来源", log: "日志" },
        { seq: "959", title: "南宁市市场监督管理局关于取消《第一类医疗器械产品备案证》的通知", publish: "2022-12-16", effect: "2022-12-16", issuer: "南宁市市场监督管理局", site: "南宁市市场监督管理局", source: "https://scjgj.nanning.gov.cn/", path: "首页 > 通知公告 > 正文", caseUrl: "查看来源", log: "日志" },
        { seq: "1013", title: "青岛市住房和城乡建设局关于进一步优化建设工程审批服务的通知", publish: "2023-01-10", effect: "2023-02-01", issuer: "青岛市住房和城乡建设局", site: "青岛市住房和城乡建设局", source: "https://sjw.qingdao.gov.cn/", path: "首页 > 政务公开 > 公文法规 > 正文", caseUrl: "查看来源", log: "日志" }
      ];
      let selectedFiles = [];
      let resultTabs = [];
      let activeTab = "empty";
      let promptScope = "";
      let promptTabOpen = false;
      let customPrompt = "";
      let toastTimer;
      const escapeHTML = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);

      function showToast(message) { window.clearTimeout(toastTimer); toast.textContent = message; toast.hidden = false; toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2600); }
      function syncComposerView() {
        const scopeOpen = scopePanel.classList.contains("is-open");
        const uploadOpen = uploadPanel.classList.contains("is-open");
        composer.classList.toggle("is-expanded", scopeOpen);
        composer.classList.toggle("is-uploading", uploadOpen);
        openScopeButton.setAttribute("aria-expanded", String(scopeOpen));
        attachmentArea.hidden = scopeOpen || uploadOpen;
        messageInput.hidden = scopeOpen;
      }
      function setScopeOpen(open) {
        if (open) uploadPanel.classList.remove("is-open");
        scopePanel.classList.toggle("is-open", open);
        syncComposerView();
        if (open) scopeSelect.focus();
      }
      function setUploadOpen(open) {
        if (open) scopePanel.classList.remove("is-open");
        uploadPanel.classList.toggle("is-open", open);
        syncComposerView();
      }
    function openFilePicker() {
      if (selectedFiles.length === 0) {
        setUploadOpen(true);
      } else {
        scopePanel.classList.remove("is-open");
        uploadPanel.classList.remove("is-open");
        syncComposerView();
        renderFiles();
      }
      excelInput.click();
    }
      function excelIcon() { return `<span class="excel-icon" aria-hidden="true">X</span>`; }
      function renderFiles() {
        attachmentCount.textContent = `${selectedFiles.length} 个文件`;
        attachmentArea.hidden = scopePanel.classList.contains("is-open") || uploadPanel.classList.contains("is-open");
        const cards = selectedFiles.map((file, index) => `<div class="file-card" title="${escapeHTML(file.name)}">${excelIcon()}<span class="file-name">${escapeHTML(file.name)}</span><button class="remove-file" type="button" data-remove-file="${index}" aria-label="移除 ${escapeHTML(file.name)}">×</button></div>`).join("");
        fileList.innerHTML = `${cards}<button class="add-card" type="button" id="add-files" aria-label="继续添加文件" title="继续添加文件"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`;
        document.getElementById("add-files").addEventListener("click", openFilePicker);
        fileList.querySelectorAll("[data-remove-file]").forEach((button) => button.addEventListener("click", () => { selectedFiles.splice(Number(button.dataset.removeFile), 1); renderFiles(); }));
      }
      function fileTabIcon() { return `<svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3h10l4 4v14H5V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 3v5h4M8 12h8M8 16h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`; }
      function promptTabIcon() { return `<svg class="tab-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h8l4 4v14H7V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 3v5h4M10 12h6M10 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`; }
      function renderTabs() {
        const resultButtons = resultTabs.map((name) => { const id = `result:${name}`; const tabName = `找源结果_${name}`; return `<button class="tab ${activeTab === id ? "is-active" : ""}" type="button" role="tab" aria-selected="${activeTab === id}" data-tab="${escapeHTML(id)}" title="${escapeHTML(tabName)}">${fileTabIcon()}<span class="tab-name">${escapeHTML(tabName)}</span><span class="tab-close" data-close-result="${escapeHTML(name)}" aria-label="关闭结果标签">×</span></button>`; }).join("");
        const promptButton = promptScope && promptTabOpen ? `<button class="tab ${activeTab === "prompt" ? "is-active" : ""}" type="button" role="tab" aria-selected="${activeTab === "prompt"}" data-tab="prompt">${promptTabIcon()}<span class="tab-name">${labels[promptScope]} Prompt</span><span class="tab-close" data-close-prompt aria-label="关闭 ${labels[promptScope]} Prompt 标签">×</span></button>` : "";
        tabs.innerHTML = resultButtons + promptButton;
        tabs.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", (event) => { if (event.target.closest("[data-close-result], [data-close-prompt]")) return; activeTab = button.dataset.tab; renderWorkspace(); }));
        tabs.querySelectorAll("[data-close-result]").forEach((button) => button.addEventListener("click", (event) => { event.stopPropagation(); const name = button.dataset.closeResult; resultTabs = resultTabs.filter((item) => item !== name); if (activeTab === `result:${name}`) activeTab = resultTabs[0] ? `result:${resultTabs[0]}` : (promptScope && promptTabOpen ? "prompt" : "empty"); renderWorkspace(); }));
        const closePromptButton = tabs.querySelector("[data-close-prompt]");
        if (closePromptButton) closePromptButton.addEventListener("click", (event) => { event.stopPropagation(); promptTabOpen = false; if (activeTab === "prompt") activeTab = resultTabs[0] ? `result:${resultTabs[0]}` : "empty"; renderWorkspace(); });
      }
      function tableHTML(fileName) {
        const rows = dataRows.map((row) => `<tr><td class="seq-cell">${row.seq}</td><td class="title-cell">${row.title}</td><td>${row.publish}</td><td>${row.effect}</td><td>${row.issuer}</td><td>${row.site}</td><td><a class="link" href="#" onclick="return false">${row.source}</a></td><td>${row.path}</td><td><a class="link" href="#" onclick="return false">${row.caseUrl}</a></td><td><a class="link" href="#" onclick="return false">${row.log}</a></td></tr>`).join("");
        return `<section class="panel result-panel is-active" aria-label="找源结果_${escapeHTML(fileName)}"><div class="result-summary"><strong>找源结果_${escapeHTML(fileName)}</strong><span>共 ${dataRows.length} 条</span><span class="result-status">找源完成</span></div><div class="table-wrap"><table><colgroup><col style="width:72px"><col style="width:220px"><col style="width:116px"><col style="width:116px"><col style="width:168px"><col style="width:168px"><col style="width:196px"><col style="width:260px"><col style="width:110px"><col style="width:80px"></colgroup><thead><tr><th>seq</th><th>标题</th><th>颁布日期</th><th>实施日期</th><th>颁布者</th><th>网站名称</th><th>数据源链接</th><th>路径</th><th>案例地址</th><th>日志</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
      }
      function promptHTML() {
        const isCustom = promptScope === "custom";
        const value = isCustom ? customPrompt : defaults[promptScope];
        return `<section class="panel prompt-panel is-active" aria-label="${labels[promptScope]} Prompt"><div class="prompt-card"><header class="prompt-header"><div class="prompt-title"><strong>${isCustom ? "编辑" : "查看"} ${labels[promptScope]} Prompt</strong><span>${isCustom ? "保存后将用于当前页面会话中的找源任务" : "平台预置 Prompt，仅支持查看和下载"}</span></div><div class="prompt-actions">${isCustom ? `<button id="import-prompt" class="button" type="button">导入 .md</button><input id="prompt-input" type="file" accept=".md,text/markdown" hidden>` : ""}<button id="download-prompt" class="button" type="button">下载</button>${isCustom ? `<button id="save-prompt" class="button primary" type="button">保存</button>` : ""}</div></header><div class="prompt-body"><label class="editor-label" for="prompt-editor"><span>Prompt 原文</span><span id="editor-meta" class="editor-meta">${value.length} 字符</span></label><textarea id="prompt-editor" class="prompt-editor" spellcheck="false" ${isCustom ? "" : "readonly"} placeholder="${isCustom ? "请输入自定义 Prompt 原文" : ""}">${escapeHTML(value)}</textarea></div></div></section>`;
      }
      function emptyHTML() { return `<div class="empty-state"><div class="empty-state-inner"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M12 11h40v42H12z" stroke="currentColor" stroke-width="2"/><path d="M21 22h22M21 31h22M21 40h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><strong>暂无找源结果</strong><span>选择范围、添加文件并发送后，结果会按文件生成标签页</span></div></div>`; }
      function bindPromptActions() {
        const editor = document.getElementById("prompt-editor");
        if (!editor) return;
        const meta = document.getElementById("editor-meta");
        editor.addEventListener("input", () => { meta.textContent = `${editor.value.length} 字符 · 未保存`; });
        document.getElementById("download-prompt").addEventListener("click", () => { const blob = new Blob([editor.value], { type: "text/markdown;charset=utf-8" }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = `${labels[promptScope]}-prompt.md`; link.click(); setTimeout(() => URL.revokeObjectURL(url), 0); showToast("Prompt 已下载到本地"); });
        const save = document.getElementById("save-prompt");
        if (save) save.addEventListener("click", () => { if (!editor.value.trim()) { showToast("Prompt 内容不能为空"); editor.focus(); return; } customPrompt = editor.value; meta.textContent = `${customPrompt.length} 字符 · 已保存`; showToast("自定义 Prompt 已保存，将用于本次找源"); });
        const importButton = document.getElementById("import-prompt");
        const promptInput = document.getElementById("prompt-input");
        if (importButton && promptInput) { importButton.addEventListener("click", () => promptInput.click()); promptInput.addEventListener("change", () => { const file = promptInput.files && promptInput.files[0]; if (!file) return; if (!file.name.toLowerCase().endsWith(".md") || file.size > 1024 * 1024) { showToast("请选择不超过 1 MB 的 .md 文件"); return; } const reader = new FileReader(); reader.onload = () => { editor.value = String(reader.result || ""); meta.textContent = `${editor.value.length} 字符 · 来自 ${file.name}`; }; reader.onerror = () => showToast("文件读取失败，请重新选择"); reader.readAsText(file); }); }
      }
      function renderWorkspace() {
        renderTabs();
        const isResult = activeTab.startsWith("result:");
        workspaceActions.hidden = !isResult;
        if (isResult) content.innerHTML = tableHTML(activeTab.slice(7));
        else if (activeTab === "prompt" && promptScope) { content.innerHTML = promptHTML(); bindPromptActions(); }
        else content.innerHTML = emptyHTML();
      }
      function addFiles(fileCollection) {
        const incoming = Array.from(fileCollection).filter((file) => /\.(xlsx|xls|csv)$/i.test(file.name));
        if (!incoming.length) { showToast("请选择 Excel 或 CSV 文件"); return; }
        const known = new Set(selectedFiles.map((file) => file.name));
        incoming.forEach((file) => { if (!known.has(file.name)) selectedFiles.push(file); });
        setUploadOpen(false); renderFiles(); showToast(`已添加 ${incoming.length} 个文件`); excelInput.value = "";
      }
      openScopeButton.addEventListener("click", () => setScopeOpen(!scopePanel.classList.contains("is-open")));
      closeScopeButton.addEventListener("click", () => setScopeOpen(false));
      closeUploadButton.addEventListener("click", () => setUploadOpen(false));
      uploadDropzone.addEventListener("click", openFilePicker);
      scopeSelect.addEventListener("change", () => { const next = scopeSelect.value; if (!next) { promptScope = ""; promptTabOpen = false; if (activeTab === "prompt") activeTab = resultTabs[0] ? `result:${resultTabs[0]}` : "empty"; renderWorkspace(); return; } promptScope = next; promptTabOpen = true; activeTab = "prompt"; renderWorkspace(); });
      openFilesButton.addEventListener("click", openFilePicker);
      excelInput.addEventListener("change", () => addFiles(excelInput.files));
      sendButton.addEventListener("click", () => { if (!scopeSelect.value) { showToast("请先选择找源范围"); scopeSelect.focus(); return; } if (!selectedFiles.length) { showToast("请先添加需要找源的文件"); openFilesButton.focus(); return; } resultTabs = selectedFiles.map((file) => file.name); promptScope = scopeSelect.value; activeTab = `result:${resultTabs[0]}`; renderWorkspace(); showToast(`已创建 ${resultTabs.length} 个文件结果标签页`); });
      renderFiles();
      renderWorkspace();
      setScopeOpen(true);
    })();
  </script>
</body>
